<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self';
             script-src 'self' 'unsafe-inline' https://storage.ko-fi.com;
             style-src 'self' 'unsafe-inline';
             img-src 'self' data: https://storage.ko-fi.com https://ko-fi.com https://cdn.ko-fi.com;
             connect-src 'self' https://storage.ko-fi.com;
             frame-src https://ko-fi.com;" />
  <title>ATHIOS WD</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="form">
    <label for="url">Website URL</label>
    <input type="text" id="url" placeholder="https://example.com" spellcheck="false" />

    <label for="folder">Save folder</label>
    <div class="row">
      <input type="text" id="folder" readonly placeholder="No folder selected" />
      <button id="browse">Browse...</button>
    </div>

    <div class="row buttons">
      <button id="start">Start</button>
      <button id="stop" disabled>Stop</button>
    </div>
  </div>

  <label for="log" class="log-label">Log</label>
  <textarea id="log" readonly wrap="off"></textarea>

  <div class="footer">
    <span id="status">Ready</span>
  </div>

  <!-- Ko-fi donation button (exact code as provided) -->
  <script type='text/javascript' src='https://storage.ko-fi.com/cdn/widget/Widget_2.js'></script>
  <script type='text/javascript'>kofiwidget2.init('Support me on Ko-fi', '#72a4f2', 'W7W116MME5');kofiwidget2.draw();</script>

  <script src="renderer.js"></script>
</body>
</html>
